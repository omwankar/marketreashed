    <!-- Single-page-app deep-link restore (paired with public/404.html).
         When a static host (e.g. GitHub Pages) bounces a deep URL through
         404.html, the request lands here with `?p=/the/original/path`.
         We rewrite history before React mounts so React Router sees the
         intended URL. No-op when there is no `p` query parameter. -->
    <script>
      (function () {
        var url = window.location;
        var params = new URLSearchParams(url.search);
        var deepPath = params.get("p");
        if (!deepPath) return;
        params.delete("p");
        var restoredSearch = params.toString();
        var restoredQuery = params.get("q") ? "?" + params.get("q").replace(/~and~/g, "&") : "";
        var hash = url.hash || "";
        window.history.replaceState(
          null,
          "",
          url.pathname.replace(/[^/]+$/, "").replace(/\/$/, "") +
            deepPath.replace(/~and~/g, "&") +
            restoredQuery +
            hash
        );
      })();
    </script>
